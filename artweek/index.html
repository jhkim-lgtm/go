<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2026 아트위크 일정 마스터 — Frieze · Kiaf | 1%CLUB</title>

</head>
<body>
<div class="pubbar">
  <span><b>공유용 읽기 전용 사본</b> · 참가확정·미참가·보류·숨기기는 이 화면에서만 적용되고 새로고침하면 돌아옵니다</span>
</div>
<style>
.pubbar{
  background:#1C222B; color:#A7B1BE; font-size:13px; text-align:center;
  padding:11px 18px; border-bottom:1px solid #2C3541; line-height:1.5;
  font-family:"Pretendard","Apple SD Gothic Neo",system-ui,sans-serif; letter-spacing:-.01em;
}
.pubbar b{color:#4A95FF;}
</style>
<style id="css">
  :root{
    --bg:#11151B;
    --panel:#1C222B;
    --panel-2:#232B36;
    --panel-3:#2A3340;
    --line:#2C3541;
    --line-soft:#232A34;
    --tx:#EAEEF4;
    --tx-2:#A7B1BE;
    --tx-3:#6E7A88;
    --blue:#4A95FF;
    --blue-dim:rgba(74,149,255,.14);
    --green:#2AC769;
    --green-dim:rgba(42,199,105,.13);
    --amber:#FFB020;
    --amber-dim:rgba(255,176,32,.13);
    --red:#FF6B6B;
    --red-dim:rgba(255,107,107,.13);
    --r-s:8px; --r-m:12px; --r-l:16px; --r-xl:20px;
    --sans:"Pretendard","Pretendard Variable","Apple SD Gothic Neo","Malgun Gothic",system-ui,-apple-system,sans-serif;
    --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--tx);
    font-family:var(--sans); font-size:15px; line-height:1.62;
    -webkit-font-smoothing:antialiased; letter-spacing:-.01em;
  }
  #root{max-width:1160px; margin:0 auto; padding:0 20px 120px;}
  h1,h2,h3{margin:0; font-weight:700; letter-spacing:-.025em; text-wrap:balance;}
  button{font-family:inherit; letter-spacing:inherit;}
  :focus-visible{outline:2px solid var(--blue); outline-offset:2px; border-radius:6px;}

  /* masthead */
  .mast{padding:52px 0 26px;}
  .kicker{
    display:inline-flex; align-items:center; gap:7px; font-size:12.5px; font-weight:600;
    color:var(--blue); background:var(--blue-dim); padding:5px 11px; border-radius:100px; margin-bottom:14px;
  }
  .mast h1{font-size:clamp(27px,4.2vw,40px); line-height:1.24;}
  .mast p{margin:12px 0 0; color:var(--tx-2); font-size:15px; max-width:62ch;}
  .stampline{margin-top:16px; font-size:12.5px; color:var(--tx-3); display:flex; flex-wrap:wrap; gap:6px 18px;}

  /* counters */
  .counters{display:grid; grid-template-columns:repeat(auto-fit,minmax(148px,1fr)); gap:10px; margin:26px 0 0;}
  .ct{background:var(--panel); border-radius:var(--r-l); padding:17px 18px 15px; display:flex; flex-direction:column; gap:3px;}
  .ct b{font-size:27px; font-weight:700; line-height:1.15; font-variant-numeric:tabular-nums; letter-spacing:-.03em;}
  .ct span{font-size:12.5px; color:var(--tx-3); font-weight:500;}
  .ct.blue b{color:var(--blue);} .ct.red b{color:var(--red);} .ct.green b{color:var(--green);}

  /* controls */
  .bar{
    position:sticky; top:0; z-index:40; background:var(--bg);
    padding:20px 0 14px; margin:26px 0 4px;
    display:flex; flex-wrap:wrap; gap:8px; align-items:center;
    box-shadow:0 12px 16px -14px var(--bg);
  }
  .chip{
    font-size:13.5px; font-weight:600; cursor:pointer; border:0;
    background:var(--panel); color:var(--tx-2);
    border-radius:100px; padding:9px 15px; transition:background .15s, color .15s;
  }
  .chip:hover{background:var(--panel-2); color:var(--tx);}
  .chip[aria-pressed="true"]{background:var(--blue); color:#fff;}
  .chip.warn[aria-pressed="true"]{background:var(--red); color:#fff;}
  .chip.hid{color:var(--tx-3);}
  .chip.hid[aria-pressed="true"]{background:var(--panel-3); color:var(--tx); box-shadow:inset 0 0 0 1px var(--line);}
  .grow{flex:1 1 auto;}
  .cta{
    font-size:13.5px; font-weight:700; cursor:pointer; border:0;
    background:var(--blue); color:#fff; border-radius:100px; padding:10px 17px;
    display:inline-flex; align-items:center; gap:6px; transition:filter .15s;
  }
  .cta:hover{filter:brightness(1.1);}
  .cta[disabled]{opacity:.45; cursor:not-allowed;}
  .tally{font-size:12.5px; color:var(--tx-3); font-variant-numeric:tabular-nums; padding-right:4px;}

  /* section */
  .sec{margin:56px 0 18px;}
  .sec h2{font-size:21px;}
  .sec p{margin:6px 0 0; color:var(--tx-3); font-size:13.5px;}

  /* day rail */
  .day{display:grid; grid-template-columns:96px 1fr; gap:0;}
  .daymark{padding:22px 16px 22px 0; position:sticky; top:74px; align-self:start;}
  .daynum{font-size:30px; font-weight:700; line-height:1; letter-spacing:-.035em; font-variant-numeric:tabular-nums;}
  .daydow{display:block; margin-top:5px; font-size:12.5px; color:var(--tx-3); font-weight:500;}
  .daytag{display:inline-block; margin-top:10px; font-size:11.5px; font-weight:600; padding:3px 9px; border-radius:100px;}
  .daytag.peak{background:var(--red-dim); color:var(--red);}
  .daytag.fair{background:var(--blue-dim); color:var(--blue);}
  .dayevents{padding:14px 0 22px; display:flex; flex-direction:column; gap:9px; min-width:0;}

  /* event card */
  .ev{background:var(--panel); border-radius:var(--r-l); padding:17px 19px; position:relative;}
  .ev.skip{background:var(--line-soft);}
  .ev.skip .evtitle{color:var(--tx-2);}
  .evhead{display:flex; gap:12px; align-items:flex-start; padding-right:172px;}
  .evtools{position:absolute; top:0; right:0; display:flex; overflow:hidden; border-radius:0 var(--r-l) 0 10px;}
  .evtools button{
    border:0; cursor:pointer; background:var(--panel-2); color:var(--tx-3);
    font-size:12px; font-weight:600; font-family:inherit; letter-spacing:inherit;
    padding:8px 13px; line-height:1.2; transition:background .15s, color .15s;
  }
  .evtools button:hover{background:var(--panel-3); color:var(--tx);}
  .evtools button.dl{padding:8px 11px; font-size:15px; line-height:1;}
  .evtools button.dl:hover{background:rgba(255,107,107,.2); color:var(--red);}
  .evtools button.un{background:var(--blue); color:#fff;}
  .evtools button.un:hover{background:var(--blue); filter:brightness(1.12); color:#fff;}
  .ev.isHidden{opacity:.5;}
  .ev.isHidden .evtitle{text-decoration:line-through; text-decoration-color:var(--tx-3);}
  .evtime{
    font-size:13px; font-weight:600; color:var(--blue); font-variant-numeric:tabular-nums;
    white-space:nowrap; padding-top:2px; flex:0 0 auto; max-width:180px;
  }
  .ev.skip .evtime{color:var(--tx-3);}
  .evbody{flex:1 1 auto; min-width:0;}
  .evtitle{font-size:16.5px; font-weight:700; line-height:1.4;}
  .evsub{margin-top:5px; font-size:13.5px; color:var(--tx-3);}
  .evsub b{color:var(--tx-2); font-weight:500;}
  .del{
    flex:0 0 auto; width:28px; height:28px; border-radius:8px; border:0; cursor:pointer;
    background:transparent; color:var(--tx-3); font-size:17px; line-height:1;
    transition:background .15s, color .15s;
  }
  .del:hover{background:var(--red-dim); color:var(--red);}
  .pills{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px;}
  .pill{font-size:12px; font-weight:600; padding:4px 10px; border-radius:100px; white-space:nowrap;}
  .pill.g{background:var(--green-dim); color:var(--green);}
  .pill.r{background:var(--red-dim); color:var(--red);}
  .pill.a{background:var(--amber-dim); color:var(--amber);}
  .pill.b{background:var(--blue-dim); color:var(--blue);}
  .pill.n{background:var(--panel-2); color:var(--tx-3);}
  .meta{margin:13px 0 0; padding-top:13px; border-top:1px solid var(--line-soft); display:flex; flex-direction:column; gap:7px;}
  .mrow{display:grid; grid-template-columns:74px 1fr; gap:12px; font-size:13.5px;}
  .mrow dt{color:var(--tx-3); font-size:12.5px; font-weight:600; padding-top:1px;}
  .mrow dd{margin:0; color:var(--tx-2);}
  .mrow.key dd{color:var(--tx);}

  /* route */
  .route{display:grid; grid-template-columns:repeat(auto-fit,minmax(196px,1fr)); gap:10px;}
  .leg{background:var(--panel); border-radius:var(--r-m); padding:15px 16px 16px; display:flex; flex-direction:column; gap:6px;}
  .leg.move{background:transparent; border:1px dashed var(--line);}
  .legt{font-size:12.5px; font-weight:700; color:var(--blue); font-variant-numeric:tabular-nums;}
  .leg.move .legt{color:var(--amber);}
  .legh{font-size:14.5px; font-weight:700; line-height:1.4;}
  .legn{font-size:12.5px; color:var(--tx-3); line-height:1.55;}

  /* 탭 */
  .tabs{display:flex; background:var(--panel); border-radius:100px; padding:3px; gap:2px; margin-right:6px;}
  .tab{
    border:0; cursor:pointer; background:transparent; color:var(--tx-3);
    font-size:13.5px; font-weight:700; padding:7px 15px; border-radius:100px;
    font-family:inherit; letter-spacing:inherit; transition:background .15s, color .15s;
  }
  .tab:hover{color:var(--tx);}
  .tab.on{background:var(--panel-3); color:var(--tx);}
  .chip.okc[aria-pressed="true"]{background:var(--green); color:#06210f;}
  .chip.paidc[aria-pressed="true"]{background:var(--amber); color:#241700;}

  /* 최종확인 카드 */
  .ev.isOK{box-shadow:inset 0 0 0 1.5px var(--green);}
  .evtools button.ok{background:var(--panel-2);}
  .evtools button.ok.on{background:var(--green); color:#06210f;}
  .evtools button.ok.on:hover{background:var(--green); filter:brightness(1.08); color:#06210f;}

  /* 주간 캘린더 */
  .calnav{display:flex; align-items:center; gap:9px; flex-wrap:wrap; margin-bottom:14px;}
  .calrange{font-size:14px; font-weight:700; font-variant-numeric:tabular-nums;}
  .calnote{margin:12px 0 0; font-size:12.5px; color:var(--tx-3);}
  .calwrap{overflow-x:auto; background:var(--panel); border-radius:var(--r-l); padding:0 0 8px;}
  .calgrid{min-width:760px;}
  .calrow{display:grid; grid-template-columns:58px repeat(7,1fr);}
  .calgut{font-size:11.5px; color:var(--tx-3); text-align:right; padding-right:9px;}
  .calhead .calday{
    padding:14px 8px 12px; text-align:center; border-left:1px solid var(--line-soft);
    display:flex; flex-direction:column; gap:2px;
  }
  .calhead .calday.hot .cdn{color:var(--blue);}
  .cdn{font-size:19px; font-weight:700; line-height:1; font-variant-numeric:tabular-nums;}
  .cdw{font-size:11.5px; color:var(--tx-3);}
  .calall{border-top:1px solid var(--line); border-bottom:1px solid var(--line); min-height:34px;}
  .calall .calgut{padding-top:8px;}
  .callcell{border-left:1px solid var(--line-soft); padding:5px 4px; display:flex; flex-direction:column; gap:3px;}
  .cchip{
    background:var(--panel-3); color:var(--tx-2); font-size:11px; border-radius:5px;
    padding:3px 6px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .cchip.paid{background:var(--amber-dim); color:var(--amber);}
  .calbody .calgut.hours{padding-top:0;}
  .hr{height:46px; position:relative;}
  .hr span{position:absolute; top:-7px; right:9px; font-variant-numeric:tabular-nums;}
  .calcol{position:relative; border-left:1px solid var(--line-soft);}
  .hline{height:46px; border-top:1px solid var(--line-soft);}
  .cev{
    position:absolute; background:var(--blue); color:#fff; border-radius:6px;
    padding:4px 6px; font-size:11px; line-height:1.3; overflow:hidden; cursor:default;
    display:flex; flex-direction:column; gap:1px; box-shadow:0 1px 3px rgba(0,0,0,.35);
  }
  .cev b{font-size:10.5px; opacity:.85; font-variant-numeric:tabular-nums;}
  .cev span{overflow:hidden; text-overflow:ellipsis;}
  .cev.paid{background:var(--amber); color:#241700;}

  /* RSVP 대기함 */
  .rgroup{margin-bottom:26px;}
  .rghead{display:flex; align-items:baseline; gap:11px; margin-bottom:11px;}
  .rghead h3{font-size:15px;}
  .rghead span{font-size:12.5px; color:var(--tx-3);}
  .rgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:10px;}
  .rbar{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:16px;}
  .rcard{background:var(--panel); border-radius:var(--r-l); padding:16px 18px 15px; display:flex; flex-direction:column; gap:9px; position:relative;}
  .rcard.st-go{box-shadow:inset 0 0 0 1.5px var(--green);}
  .rcard.st-hold{box-shadow:inset 0 0 0 1.5px var(--amber);}
  .rcard.st-no{opacity:.62;}
  .rcard.st-no .rtitle{text-decoration:line-through; text-decoration-color:var(--tx-3);}
  .rcard.isHidden{opacity:.45;}
  .rcard.isHidden .rtitle{text-decoration:line-through; text-decoration-color:var(--tx-3);}
  .rtools{border-radius:0 var(--r-l) 0 10px;}
  .rtop{display:flex; align-items:center; gap:9px; flex-wrap:wrap; padding-right:78px; min-height:30px;}
  .rseg{display:grid; grid-template-columns:repeat(3,1fr); gap:5px; margin-top:11px; padding-top:11px; border-top:1px solid var(--line-soft);}
  .sg{
    border:0; cursor:pointer; background:var(--panel-2); color:var(--tx-3);
    font-size:12.5px; font-weight:700; font-family:inherit; letter-spacing:inherit;
    padding:9px 4px; border-radius:9px; transition:background .15s, color .15s;
  }
  .sg:hover{background:var(--panel-3); color:var(--tx);}
  .sg.s-go.on{background:var(--green); color:#06210f;}
  .sg.s-no.on{background:var(--red); color:#2b0808;}
  .sg.s-hold.on{background:var(--amber); color:#241700;}
  .chip.noc[aria-pressed="true"]{background:var(--red); color:#fff;}
  .rwhen{font-size:12.5px; color:var(--tx-3); font-variant-numeric:tabular-nums;}
  .rtitle{font-size:15.5px; font-weight:700; line-height:1.4;}
  .rdesc{margin:0; font-size:13px; color:var(--tx-2); line-height:1.6;}
  .rfoot{margin-top:auto; padding-top:9px; display:flex; align-items:center; gap:11px; flex-wrap:wrap;}
  .rlink{
    font-size:13px; font-weight:700; color:#fff; background:var(--blue);
    padding:8px 14px; border-radius:100px; text-decoration:none; white-space:nowrap;
    transition:filter .15s;
  }
  .rlink:hover{filter:brightness(1.12);}
  .rlink.off{background:var(--panel-3); color:var(--tx-3);}
  .rsrc{font-size:12px; color:var(--tx-3); line-height:1.4;}

  .note{background:var(--panel); border-radius:var(--r-l); padding:18px 20px; margin-top:12px;}
  .note.red{border-left:3px solid var(--red);}
  .note.amber{border-left:3px solid var(--amber);}
  .note h3{font-size:14.5px; margin-bottom:8px;}
  .note p, .note li{color:var(--tx-2); font-size:13.5px; margin:0;}
  .note ul{margin:0; padding-left:17px; display:flex; flex-direction:column; gap:6px;}

  /* table */
  .tw{overflow-x:auto; background:var(--panel); border-radius:var(--r-l); padding:4px 4px 6px;}
  table{border-collapse:collapse; width:100%; min-width:760px; font-size:13.5px;}
  th{
    text-align:left; font-size:12px; font-weight:600; color:var(--tx-3);
    padding:14px 16px 10px; white-space:nowrap;
  }
  td{padding:13px 16px; border-top:1px solid var(--line-soft); vertical-align:top; color:var(--tx-2);}
  td:first-child{color:var(--tx); font-weight:600;}
  tr.hot td:first-child{color:var(--red);}
  .due{font-variant-numeric:tabular-nums; white-space:nowrap; font-weight:600;}
  .due.hot{color:var(--red);}
  .sm{font-weight:400; color:var(--tx-3); font-size:12.5px;}

  /* dialog */
  dialog{
    border:0; padding:0; background:var(--panel); color:var(--tx); border-radius:var(--r-xl);
    width:min(620px, calc(100vw - 32px)); max-height:86vh;
  }
  dialog::backdrop{background:rgba(8,11,15,.72);}
  .dlg{display:flex; flex-direction:column; max-height:86vh;}
  .dlghead{padding:24px 26px 16px;}
  .dlghead h2{font-size:19px;}
  .dlghead p{margin:6px 0 0; color:var(--tx-3); font-size:13px;}
  .dlgbody{padding:0 26px; overflow-y:auto; display:grid; grid-template-columns:1fr 1fr; gap:13px;}
  .fld{display:flex; flex-direction:column; gap:6px;}
  .fld.wide{grid-column:1 / -1;}
  .fld label{font-size:12.5px; font-weight:600; color:var(--tx-3);}
  .fld input, .fld select, .fld textarea{
    background:var(--panel-2); border:1px solid transparent; color:var(--tx);
    border-radius:var(--r-m); padding:11px 13px; font-size:14px; font-family:inherit;
    letter-spacing:inherit; width:100%; transition:border-color .15s, background .15s;
  }
  .fld textarea{resize:vertical; min-height:62px; line-height:1.55;}
  .fld input:focus, .fld select:focus, .fld textarea:focus{
    outline:none; border-color:var(--blue); background:var(--panel-3);
  }
  .fld input::placeholder, .fld textarea::placeholder{color:var(--tx-3);}
  .dlgfoot{padding:18px 26px 24px; display:flex; gap:9px; align-items:center;}
  .ghost{
    background:var(--panel-2); color:var(--tx-2); border:0; border-radius:100px;
    padding:10px 17px; font-size:13.5px; font-weight:600; cursor:pointer;
  }
  .ghost:hover{background:var(--panel-3); color:var(--tx);}

  /* toast */
  #toast{
    position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(14px);
    background:var(--panel-3); color:var(--tx); padding:12px 20px; border-radius:100px;
    font-size:13.5px; font-weight:600; opacity:0; pointer-events:none;
    transition:opacity .2s, transform .2s; z-index:100; box-shadow:0 8px 28px rgba(0,0,0,.5);
  }
  #toast.on{opacity:1; transform:translateX(-50%) translateY(0);}
  #toast.err{background:var(--red); color:#fff;}

  .ro{
    display:none; margin:18px 0 0; background:var(--amber-dim); color:var(--amber);
    padding:12px 16px; border-radius:var(--r-m); font-size:13px; font-weight:600;
  }
  .ro.on{display:block;}
  .empty{padding:44px 0; text-align:center; color:var(--tx-3); font-size:14px;}
  .foot{margin-top:60px; padding-top:22px; border-top:1px solid var(--line-soft); font-size:12.5px; color:var(--tx-3); display:flex; flex-wrap:wrap; gap:6px 24px;}

  @media (max-width:760px){
    #root{padding:0 15px 100px;}
    .day{grid-template-columns:1fr;}
    .daymark{position:static; padding:20px 0 4px; display:flex; align-items:baseline; gap:11px;}
    .daynum{font-size:23px;} .daydow{margin-top:0;} .daytag{margin-top:0;}
    .dlgbody{grid-template-columns:1fr;}
    .evhead{flex-wrap:wrap;}
    .evtime{max-width:none;}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none !important;}}
</style>

"use strict";

];

const DAYTAG = {
 "2026-09-01":["peak","저녁 4건 겹침"],
 "2026-09-02":["peak","최난이도"],
 "2026-09-03":["peak","6건 겹침 · 최대 밀도"],
 "2026-09-04":["fair","조성진"]
};
const DOW = ["일","월","화","수","목","금","토"];

/* ── 상태 ─────────────────────────────────────────────── */
/* BK가 8/26 '응답완료'로 표시했던 2건 — 새 3단계 체계에서 참가확정으로 이관 */
const SEED_RSVP = { r01:{s:"go"}, r02:{s:"go"}, r06:{s:"go"}, r07:{s:"go"} };

function loadState(){
  const tag = document.getElementById("data");
  if(tag){
    try{
      const p = JSON.parse(tag.textContent);
      if(p && Array.isArray(p.events) && p.events.length){
        if(!p.rsvpState) p.rsvpState = {};
        // 구버전 '응답완료(done)' → '참가확정(go)'으로 이관
        for(const k in p.rsvpState){
          const v = p.rsvpState[k];
          if(v && v.done){ if(!v.s) v.s = "go"; delete v.done; }
        }
        return p;
      }
    }catch(e){}
  }
  return {events: SEED.slice(), rsvpState: JSON.parse(JSON.stringify(SEED_RSVP))};
}
let state = loadState();
let filter = "all";
let view = "cal";
let rsvpView = "open";
let calWeek = 0;
let calAll = false;
let canWrite = false;
let artifactNs = null;

/* ── 유틸 ─────────────────────────────────────────────── */
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function sortKey(e){
  if(e.sort) return e.sort;
  const m = String(e.time||"").match(/(\d{1,2}):(\d{2})/);
  return m ? m[1].padStart(2,"0")+":"+m[2] : "99:99";
}
function ordered(list){
  return list.slice().sort((a,b)=>
    a.date===b.date ? sortKey(a).localeCompare(sortKey(b)) : a.date.localeCompare(b.date));
}
function dowOf(iso){
  const p = iso.split("-");
  return DOW[new Date(+p[0], +p[1]-1, +p[2]).getDay()];
}
function isTodo(e){ return e.todo===1 || e.todo===true; }
function hasPress(e){ return /취재 있음|취재 가능/.test(e.press||""); }

function isPaid(e){ return /유가|💰/.test((e.cat||"")+(e.press||"")+(e.key||"")); }

function matches(e){
  if(filter==="hidden") return !!e.hidden;
  if(filter==="allinc") return true;
  if(e.hidden) return false;
  if(filter==="all") return true;
  if(filter==="ok") return !!e.confirmed;
  if(filter==="paid") return isPaid(e);
  if(filter==="fair") return e.type==="fair";
  if(filter==="party") return e.type==="night";
  if(filter==="press") return hasPress(e);
  if(filter==="todo") return isTodo(e);
  return true;
}

/* ── 주간 캘린더 ──────────────────────────────────────── */
const HOUR0 = 9, HOUR1 = 24, HPX = 46;
const DAYN = ["월","화","수","목","금","토","일"];

function ymd(d){
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function mondayOf(iso){
  const p = iso.split("-").map(Number);
  const d = new Date(p[0], p[1]-1, p[2]);
  const wd = (d.getDay()+6)%7;          // 월=0
  d.setDate(d.getDate()-wd);
  return d;
}
function parseSpan(e){
  const hits = String(e.time||"").match(/\d{1,2}:\d{2}/g);
  if(!hits) return null;                 // 종일 취급
  const toMin = s => { const a=s.split(":"); return (+a[0])*60 + (+a[1]); };
  let st = toMin(hits[0]);
  let en = hits.length>1 ? toMin(hits[1]) : 0;
  if(!(en>st)) en = st + 90;
  return {st, en};
}
function calPool(){
  return state.events.filter(e => !e.hidden && (calAll || e.confirmed));
}

/* ── 렌더 ─────────────────────────────────────────────── */
function evCard(e){
  let cls = e.type==="skip" ? "ev skip" : "ev";
  if(e.hidden) cls += " isHidden";
  let pills = "";
  if(e.cal) pills += '<span class="pill b">📅 구글 캘린더 확정</span>';
  if(hasPress(e)) pills += '<span class="pill g">'+esc(e.press)+'</span>';
  else if(e.press && e.press!=="—") pills += '<span class="pill n">취재 '+esc(e.press)+'</span>';
  if(e.up) pills += '<span class="pill b">업로드 · '+esc(e.up)+'</span>';
  if(/미회신|미신청|미확인|마감|필요/.test(e.rsvp||"")) pills += '<span class="pill r">'+esc(e.rsvp)+'</span>';
  else if(e.rsvp && e.rsvp!=="—") pills += '<span class="pill n">'+esc(e.rsvp)+'</span>';
  if(/미확정|미정/.test(e.roster||"")) pills += '<span class="pill a">'+esc(e.roster)+'</span>';
  else if(e.roster && !/해당없음|—/.test(e.roster)) pills += '<span class="pill n">'+esc(e.roster)+'</span>';

  const rows = [];
  if(e.key) rows.push(["키포인트", e.key, "key"]);
  if(e.due) rows.push(["업로드 기한", e.due, "key"]);
  if(e.contact && e.contact!=="—") rows.push(["컨택", e.contact, ""]);
  if(e.note) rows.push(["메모", e.note, ""]);
  const meta = rows.length ? '<dl class="meta">'+rows.map(r =>
    '<div class="mrow '+r[2]+'"><dt>'+r[0]+'</dt><dd>'+esc(r[1])+'</dd></div>').join("")+'</dl>' : "";

  if(e.confirmed) cls += " isOK";
  const tools = '<div class="evtools">'+
    (canWrite ? '<button class="dl" data-del="'+esc(e.id)+'" aria-label="일정 삭제" title="영구 삭제">×</button>' : '')+
    '<button class="ok'+(e.confirmed?" on":"")+'" data-ok="'+esc(e.id)+'">'+(e.confirmed?"✓ 확인됨":"최종확인")+'</button>'+
    (e.hidden
      ? '<button class="un" data-show="'+esc(e.id)+'">다시 표시</button>'
      : '<button data-hide="'+esc(e.id)+'">숨기기</button>')+
  '</div>';

  return '<article class="'+cls+'" data-id="'+esc(e.id)+'">'+ tools +
    '<div class="evhead">'+
      '<span class="evtime">'+esc(e.time)+'</span>'+
      '<div class="evbody"><div class="evtitle">'+esc(e.title)+'</div>'+
        '<div class="evsub">'+esc(e.cat)+(e.place?' &nbsp;·&nbsp; <b>'+esc(e.place)+'</b>':'')+'</div></div>'+
    '</div>'+ (pills?'<div class="pills">'+pills+'</div>':'') + meta +
  '</article>';
}

function timelineHTML(){
  const list = ordered(state.events).filter(matches);
  if(!list.length) return '<p class="empty">'+(
      filter==="hidden" ? '숨긴 일정이 없습니다. 카드 오른쪽 위 ‘숨기기’를 누르면 여기로 옵니다.'
    : filter==="ok"     ? '아직 최종확인한 일정이 없습니다. 카드 오른쪽 위 ‘최종확인’을 눌러보세요.'
    : '이 조건에 해당하는 일정이 없습니다.')+'</p>';
  let out = "", cur = null;
  list.forEach((e,i) => {
    if(e.date !== cur){
      if(cur !== null) out += '</div></div>';
      cur = e.date;
      const tag = DAYTAG[e.date];
      const mm = +e.date.slice(5,7), dd = +e.date.slice(8,10);
      out += '<div class="day"><div class="daymark">'+
        '<span class="daynum">'+dd+'</span>'+
        '<span class="daydow">'+mm+'월 · '+dowOf(e.date)+'</span>'+
        (tag?'<span class="daytag '+tag[0]+'">'+tag[1]+'</span>':'')+
        '</div><div class="dayevents">';
    }
    out += evCard(e);
    if(i===list.length-1) out += '</div></div>';
  });
  return out;
}

function calendarHTML(){
  const base = mondayOf("2026-09-02");
  base.setDate(base.getDate() + calWeek*7);
  const days = [];
  for(let i=0;i<7;i++){ const d=new Date(base); d.setDate(d.getDate()+i); days.push(ymd(d)); }
  const pool = calPool();
  const total = state.events.filter(e=>!e.hidden && e.confirmed).length;

  const head = '<div class="calrow calhead"><div class="calgut"></div>'+
    days.map(iso=>{
      const dd=+iso.slice(8,10), mm=+iso.slice(5,7), i=days.indexOf(iso);
      const hot = DAYTAG[iso] ? " hot" : "";
      return '<div class="calday'+hot+'"><span class="cdn">'+dd+'</span>'+
             '<span class="cdw">'+mm+'월 '+DAYN[i]+'</span></div>';
    }).join("")+'</div>';

  // 종일 / 시간 미정
  const allday = '<div class="calrow calall"><div class="calgut">종일</div>'+
    days.map(iso=>{
      const items = pool.filter(e=>e.date===iso && !parseSpan(e));
      return '<div class="callcell">'+items.map(e=>
        '<div class="cchip'+(isPaid(e)?" paid":"")+'" title="'+esc(e.title)+'">'+esc(e.title)+'</div>').join("")+'</div>';
    }).join("")+'</div>';

  // 시간 그리드
  let gut = '<div class="calgut hours">';
  for(let h=HOUR0;h<HOUR1;h++) gut += '<div class="hr"><span>'+h+':00</span></div>';
  gut += '</div>';

  const cols = days.map(iso=>{
    const items = pool.filter(e=>e.date===iso).map(e=>({e, s:parseSpan(e)})).filter(x=>x.s);
    items.sort((a,b)=> a.s.st-b.s.st || a.s.en-b.s.en);
    const ends=[];
    items.forEach(it=>{ let c=0; while(c<ends.length && ends[c]>it.s.st) c++; it.col=c; ends[c]=it.s.en; });
    const n = Math.max(1, ends.length);
    let lines=""; for(let h=HOUR0;h<HOUR1;h++) lines += '<div class="hline"></div>';
    const blocks = items.map(it=>{
      const top = (Math.max(it.s.st, HOUR0*60) - HOUR0*60) / 60 * HPX;
      const hgt = Math.max(26, (Math.min(it.s.en, HOUR1*60) - Math.max(it.s.st, HOUR0*60)) / 60 * HPX - 3);
      const w = 100/n, left = it.col*w;
      const hh = m => String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
      return '<div class="cev'+(isPaid(it.e)?" paid":"")+'" style="top:'+top.toFixed(1)+'px;height:'+hgt.toFixed(1)+
        'px;left:'+left.toFixed(2)+'%;width:calc('+w.toFixed(2)+'% - 3px)" title="'+esc(it.e.title+" · "+it.e.place)+'">'+
        '<b>'+hh(it.s.st)+'</b><span>'+esc(it.e.title)+'</span></div>';
    }).join("");
    return '<div class="calcol">'+lines+blocks+'</div>';
  }).join("");

  const nav = '<div class="calnav">'+
    '<button class="ghost" id="wprev">← 이전 주</button>'+
    '<span class="calrange">'+days[0].slice(5).replace("-","/")+' – '+days[6].slice(5).replace("-","/")+'</span>'+
    '<button class="ghost" id="wnext">다음 주 →</button>'+
    '<span class="grow"></span>'+
    '<button class="chip" id="caltoggle" aria-pressed="'+(calAll?"false":"true")+'">'+
      (calAll ? "전체 일정 보는 중" : "최종확인만 보는 중")+'</button>'+
  '</div>';

  const empty = (!calAll && total===0)
    ? '<p class="empty">아직 최종확인한 일정이 없습니다. 목록에서 카드 오른쪽 위 ‘최종확인’을 누르면 여기에 쌓입니다.</p>'
    : '';

  const gaps = '<div class="note red" style="margin-top:20px"><h3>캘린더에 아직 안 들어간 것 — 확인이 필요합니다</h3><ul>'+
    '<li><b>현대백화점 《아트 이브닝》 9/2 19:00</b> — 바터 계약이 걸린 자리인데 캘린더에 없습니다. 초대권 6매도 배분 전입니다</li>'+
    '<li><b>마리끌레르 《Where Art Connects》 9/3</b> — A-DAY(13:00) · A-NIGHT(18:00) 둘 다 미등록. 초대권 6매를 받아둔 상태입니다</li>'+
    '<li><b>조성진 Kiaf Classic 9/4</b> — 티켓 2매 확보. 공연 시간을 확인하셔야 캘린더에 넣을 수 있습니다</li>'+
    '<li><b>KORI Gin at FOUNDRY 9/1 19:00</b> — 안지원 박사 직접 초청. 캘린더상 18:00 바카라 바와 20:00 SAM 사이가 비어 있어 들를 수 있습니다</li>'+
    '<li><b>GRAFF 8/28 11:00 · 골드윈 8/28 18:00</b> — 그날 14시 롤스로이스 미팅, 20시 최선상회 디너가 이미 있습니다</li>'+
    '</ul></div>';

  return nav + empty +
    '<div class="calwrap"><div class="calgrid">'+head+allday+
    '<div class="calrow calbody">'+gut+cols+'</div></div></div>'+
    '<p class="calnote">📅 표시는 대표님이 구글 캘린더에 직접 넣으신 일정입니다. 시간이 정해지지 않은 것은 맨 위 ‘종일’ 줄에 붙습니다.</p>'+
    gaps;
}

function rs(id){ return (state.rsvpState && state.rsvpState[id]) || {}; }

const STAT = [
  ["go",  "참가확정", "go"],
  ["no",  "미참가",   "no"],
  ["hold","보류",     "hold"]
];

function rsvpVisible(r){
  const st = rs(r.id);
  if(rsvpView==="hidden") return !!st.hidden;
  if(rsvpView==="all")    return true;
  if(st.hidden) return false;
  if(rsvpView==="open")   return !st.s;
  return st.s === rsvpView;           // go / no / hold
}

          seg+

      }).join("")+'</div></div>';
  }).join("");

  const cnt = k => RSVP.filter(r=>!rs(r.id).hidden && rs(r.id).s===k).length;
  const nHid  = RSVP.filter(r=>rs(r.id).hidden).length;

  return tabs + body + empty;

function formHTML(){
  return FIELDS.map(f => {
    const [k,label,kind,ph,req,wide] = f;
    let input;
    if(kind==="select"){
      input = '<select name="'+k+'">'+ph.split("|").map(o=>'<option>'+o+'</option>').join("")+'</select>';
    }else if(kind==="select2"){
      input = '<select name="'+k+'">'+ph.split("|").map(o=>{
        const p=o.split(":"); return '<option value="'+p[0]+'">'+p[1]+'</option>';}).join("")+'</select>';
    }else if(kind==="textarea"){
      input = '<textarea name="'+k+'" placeholder="'+ph+'"></textarea>';
    }else{
      input = '<input name="'+k+'" type="'+kind+'" placeholder="'+ph+'"'+(req?" required":"")+'>';
    }
    return '<div class="fld'+(wide?" wide":"")+'"><label for="'+k+'">'+label+(req?' *':'')+'</label>'+input+'</div>';
  }).join("");
}

/* ── 토스트 ───────────────────────────────────────────── */
let toastTimer;
function toast(msg, err){
  const t = document.getElementById("toast");
  if(!t) return;
  t.textContent = msg;
  t.className = "on" + (err ? " err" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ t.className = ""; }, 3200);
}

/* ── 추가 / 삭제 ──────────────────────────────────────── */
function openAdd(){
  const dlg = document.getElementById("dlg");
  dlg.querySelector('[name="date"]').value = "2026-09-02";
  dlg.showModal();
}

function onSubmit(ev){
  const btn = ev.submitter;
  if(btn && btn.value === "cancel") return;
  const fd = new FormData(ev.target);
  const item = {id: "u" + Date.now().toString(36)};
  FIELDS.forEach(f => {
    const v = (fd.get(f[0]) || "").toString().trim();
    if(v) item[f[0]] = v;
  });
  if(!item.date || !item.title){ toast("날짜와 이벤트명은 필요합니다", true); return; }
  if(!item.time) item.time = "시간 미정";
  if(!item.type) item.type = "other";
  if(!item.cat) item.cat = "일정";
  item.todo = /미회신|미정|미확정|필요|미신청/.test((item.rsvp||"")+(item.roster||"")) ? 1 : 0;
  state.events.push(item);
  setTimeout(() => save(item.title + " 추가됨"), 0);
}

function commitRsvp(label){
  if(!canWrite){ render(); toast("이 화면에서만 " + label + "했습니다"); return; }
  save(label);
}

function setRsvpStatus(id, v){
  if(!state.rsvpState) state.rsvpState = {};
  const st = state.rsvpState[id] || (state.rsvpState[id] = {});
  const off = st.s === v;
  if(off) delete st.s; else st.s = v;
  if(!Object.keys(st).length) delete state.rsvpState[id];
  const name = (STAT.find(x=>x[0]===v)||["","선택"])[1];
  commitRsvp(off ? name + " 해제" : name + "으로 표시");
}

function setRsvpHidden(id, on){
  if(!state.rsvpState) state.rsvpState = {};
  const st = state.rsvpState[id] || (state.rsvpState[id] = {});
  if(on) st.hidden = true; else delete st.hidden;
  if(!Object.keys(st).length) delete state.rsvpState[id];
  commitRsvp(on ? "숨김 처리" : "다시 표시");
}

function toggleOK(id){
  const e = state.events.find(x => x.id === id);
  if(!e) return;
  if(e.confirmed) delete e.confirmed; else e.confirmed = true;
  if(!canWrite){
    render();
    toast(e.confirmed ? "이 화면에서만 확인 표시했습니다" : "확인을 해제했습니다");
    return;
  }
  save(e.confirmed ? "최종확인" : "확인 해제");
}

function setHidden(id, on){
  const e = state.events.find(x => x.id === id);
  if(!e) return;
  if(on) e.hidden = true; else delete e.hidden;
  if(!canWrite){
    render();
    toast(on ? "이 화면에서만 숨겼습니다" : "다시 표시했습니다");
    return;
  }
  save(on ? "숨김 처리" : "다시 표시");
}

function removeEvent(id){
  const e = state.events.find(x => x.id === id);
  if(!e) return;
  if(!confirm("‘" + e.title + "’ 일정을 지울까요?")) return;
  state.events = state.events.filter(x => x.id !== id);
  save(e.title + " 삭제됨");
}

/* ── 저장 (자체 발행) ─────────────────────────────────── */
function buildDoc(){
  const css = document.getElementById("css").textContent;
  const app = document.getElementById("app").textContent;
  const json = JSON.stringify({events: state.events, rsvpState: state.rsvpState || {}})
    .replace(/</g, "\\u003c");
  return '<!doctype html>\n<html lang="ko">\n<head>\n<meta charset="utf-8">\n' +
    '<meta name="viewport" content="width=device-width,initial-scale=1">\n' +
    '<title>2026 아트위크 일정 마스터 — Frieze · Kiaf</title>\n' +
    '<style id="css">' + css + '</style>\n</head>\n<body>\n<div id="root"></div>\n' +
    '<script id="data" type="application/json">' + json + '<\/script>\n' +
    '<script id="app">' + app + '<\/script>\n</body>\n</html>';
}

let saving = false;
async function save(msg){
  render();
  if(saving) return;
  if(!artifactNs){ toast("저장 기능을 쓸 수 없어 이 화면에만 반영됐습니다", true); return; }
  saving = true;
  toast("저장하는 중…");
  try{
    await artifactNs.publish(buildDoc());
    toast(msg + " · 저장 완료");
  }catch(err){
    const code = err && err.code;
    if(code === "conflict"){
      toast("다른 곳에서 먼저 저장했습니다. 최신 버전으로 새로고침합니다", true);
    }else if(code === "not_writer" || code === "not_granted" || code === "not_declared"){
      canWrite = false; render();
      const ro = document.getElementById("ro"); if(ro) ro.className = "ro on";
      toast("이 화면은 읽기 전용입니다", true);
    }else if(code === "rate_limited"){
      toast("저장이 너무 잦습니다. 잠시 후 다시 시도해 주세요", true);
    }else{
      toast("저장하지 못했습니다. 다시 시도해 주세요", true);
    }
  }finally{ saving = false; }
}

}
