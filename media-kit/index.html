<img alt="" class="rv-mast" decoding="async" height="206" src="./assets/deck-mast.webp" width="3840"/><h2 class="rv-title" id="partner-network-title">제휴 매체와 크리에이터 활용</h2>
<p class="fb-partner-lead">브랜드의 고객과 목적에 맞춰, 전달할 채널과 참여할 사람을 구성합니다.</p><div class="fb-network-grid"><article class="fb-network-card"><p class="fb-kicker">OWNED MEDIA</p>
<h3>보유 채널</h3><h4>브랜드의 이야기를 직접 제작·발행</h4><p class="fb-network-body">한국·일본·외국인 독자 가운데 고객층에 맞는 채널을 선택하고, 독자의 언어와 관심사에 맞춰 콘텐츠를 만듭니다.</p>
<p class="fb-network-scope">1%CLUB Korea · Japan · MyFirstKorea</p></article><article class="fb-network-card"><p class="fb-kicker">PARTNER MEDIA</p>
<h3>제휴 매체</h3><h4>다른 독자층으로 콘텐츠 확산</h4><p class="fb-network-body">캠페인 주제와 맞는 제휴 매체를 선정하고, 게재 형식과 일정을 조율해 브랜드 콘텐츠를 배포합니다.</p>
<p class="fb-network-scope">매체 선정 · 콘텐츠 조율 · 게재 관리</p></article><article class="fb-network-card"><p class="fb-kicker">CREATORS</p>
<h3>크리에이터</h3><h4>현장 경험을 콘텐츠로 연결</h4><p class="fb-network-body">브랜드와 맞는 크리에이터를 선정해 행사에 초청하고, 현장에서 경험한 이야기가 콘텐츠로 이어지도록 운영합니다.</p>
