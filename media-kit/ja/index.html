<img alt="" class="rv-mast" decoding="async" height="206" src="./assets/deck-mast.webp" width="3840"/><h2 class="rv-title" id="partner-network-title">提携メディアとクリエイターの活用</h2>
<p class="fb-partner-lead">ブランドの顧客層と目的に合わせて、発信先と参加者を組み合わせます。</p><div class="fb-network-grid"><article class="fb-network-card"><p class="fb-kicker">OWNED MEDIA</p>
<h3>運営メディア</h3><h4>ブランドの物語を制作・配信</h4><p class="fb-network-body">韓国・日本・海外の読者からターゲットに合う媒体を選び、読者の言語と関心に合わせてコンテンツを制作します。</p>
<p class="fb-network-scope">1%CLUB Korea · Japan · MyFirstKorea</p></article><article class="fb-network-card"><p class="fb-kicker">PARTNER MEDIA</p>
<h3>提携メディア</h3><h4>新たな読者層へ届ける</h4><p class="fb-network-body">キャンペーンに合う提携媒体を選定し、掲載形式とスケジュールを調整してブランドのコンテンツを配信します。</p>
<p class="fb-network-scope">媒体選定 · 内容調整 · 掲載管理</p></article><article class="fb-network-card"><p class="fb-kicker">CREATORS</p>
<h3>クリエイター</h3><h4>現場の体験をコンテンツへ</h4><p class="fb-network-body">ブランドに合うクリエイターをイベントに招待し、現場での体験がコンテンツにつながるよう運営します。</p>
<p class="fb-network-scope">参加者選定 · 招待・出欠管理 · 現場コンテンツ</p></article></div></section></figure>
